name: CI

on:
  push:
    branches: [main, dev, "feat/*"]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Ruff check
        run: ruff check src/ tests/ scripts/ docs/

      - name: Import guard (no rns/lxmf in pure-logic modules)
        run: python scripts/check_imports.py

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Run tests
        run: pytest tests/ -q

  pii-sweep:
    name: PII sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so --commits can walk the commits this push/PR adds.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stdlib only: no dependency install needed.
      - name: Security sweep (current tree)
        run: python3 scripts/security-sweep.py

      # A leak introduced and redacted within one push leaves the final tree
      # clean. Scan the commits themselves: changed blobs at each commit plus
      # each commit message.
      - name: Security sweep (commits in this PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/security-sweep.py --commits "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Security sweep (pushed commits)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/security-sweep.py --commits "${{ github.event.before }}..${{ github.sha }}"

      # A brand-new branch has no "before" commit. Do NOT use --not --remotes
      # here: by the time this job runs the branch is already on the remote, so
      # that range is empty and the check would pass without scanning anything.
      # Exclude the default branches instead, falling back to all history when
      # neither is fetched (fetch-depth: 0 fetches them, but do not assume it).
      - name: Security sweep (new branch commits)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: |
          bases=""
          for ref in origin/dev origin/main; do
            git rev-parse --verify --quiet "$ref" >/dev/null && bases="$bases $ref"
          done
          if [ -n "$bases" ]; then
            python3 scripts/security-sweep.py --commits HEAD --not $bases
          else
            python3 scripts/security-sweep.py --commits HEAD
          fi
